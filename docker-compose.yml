  app:
    build:
      context: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: booking
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: